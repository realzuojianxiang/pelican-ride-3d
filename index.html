<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>鹈鹕骑自行车 · 3D 交互网页</title>
<meta name="description" content="一只鹈鹕在无尽公路上骑自行车的 3D 动画网页：程序化建模、骨骼摆动、物理 pedal 传动、风声与铃声合成、Bloom 后期与多视角镜头。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%A4%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --ui-bg: rgba(12,18,28,.62);
    --ui-border: rgba(255,255,255,.14);
    --accent: #ffc94d;
    --accent2: #49d0ff;
    --text: #eaf2ff;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0a0e14; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- 加载层 ---------- */
  #loader{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background: radial-gradient(120% 90% at 50% 40%, #16324a 0%, #0a0e14 70%);
    transition: opacity .6s ease, visibility .6s;
  }
  #loader.hide{ opacity:0; visibility:hidden; }
  .pelican-emoji{ font-size:64px; animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-4deg);} 50%{ transform: translateY(-14px) rotate(4deg);} }
  #loader h1{ margin:0; font-size:20px; letter-spacing:.14em; font-weight:600; }
  .bar{ width:min(320px,60vw); height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition: width .25s ease; }
  #loader small{ opacity:.6; font-size:12px; letter-spacing:.08em; }

  /* ---------- HUD ---------- */
  .panel{
    position:fixed; z-index:20; background:var(--ui-bg); border:1px solid var(--ui-border);
    border-radius:14px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 12px 34px rgba(0,0,0,.36);
  }
  #hud{ left:16px; top:16px; padding:12px 14px; min-width:186px; }
  #hud .row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:3px 0; font-size:12px; opacity:.85; }
  #hud .row b{ font-size:15px; font-weight:700; font-variant-numeric: tabular-nums; }
  #hud .k{ opacity:.65; letter-spacing:.06em; }
  .speedo{ display:flex; align-items:flex-end; gap:6px; margin:2px 0 8px; }
  .speedo #speed{ font-size:38px; line-height:1; font-weight:800; letter-spacing:-.02em; color:var(--accent); font-variant-numeric: tabular-nums; }
  .speedo span{ font-size:11px; opacity:.6; padding-bottom:5px; }
  .meter{ height:5px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:2px; }
  .meter > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#49d0ff,#ffc94d,#ff6b6b); }

  /* ---------- 控制台 ---------- */
  #dock{
    left:50%; transform:translateX(-50%); bottom:16px; padding:10px 12px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; max-width:96vw;
  }
  button.btn{
    appearance:none; border:1px solid var(--ui-border); background:rgba(255,255,255,.06);
    color:var(--text); font:inherit; font-size:12.5px; padding:8px 12px; border-radius:10px; cursor:pointer;
    transition: background .18s, transform .12s, border-color .18s; white-space:nowrap;
  }
  button.btn:hover{ background:rgba(255,255,255,.14); transform: translateY(-1px); }
  button.btn:active{ transform: translateY(1px) scale(.98); }
  button.btn.on{ background:linear-gradient(180deg, rgba(255,201,77,.28), rgba(255,201,77,.14)); border-color:rgba(255,201,77,.55); color:#fff2cf; }
  .sep{ width:1px; height:24px; background:var(--ui-border); margin:0 2px; }
  kbd{ font:inherit; font-size:10px; opacity:.6; border:1px solid var(--ui-border); border-radius:4px; padding:0 4px; margin-left:5px; }

  #tips{ right:16px; top:16px; padding:10px 13px; font-size:11.5px; line-height:1.85; max-width:210px; opacity:.95; }
  #tips b{ color:var(--accent2); font-weight:600; }
  #tips .t{ font-size:11px; letter-spacing:.14em; opacity:.55; margin-bottom:4px; }

  /* ---------- 提示气泡 ---------- */
  #toast{
    position:fixed; left:50%; top:76px; transform:translate(-50%,-14px); z-index:40;
    padding:9px 16px; border-radius:99px; font-size:13px; letter-spacing:.04em;
    background:rgba(10,16,26,.8); border:1px solid var(--ui-border); backdrop-filter: blur(10px);
    opacity:0; pointer-events:none; transition: opacity .3s, transform .3s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #squawk{
    position:fixed; z-index:30; left:50%; bottom:96px; transform:translateX(-50%);
    font-size:13px; padding:7px 14px; border-radius:14px 14px 14px 4px;
    background:linear-gradient(180deg,#fff6dd,#ffd977); color:#3a2a06; font-weight:600;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  #squawk.show{ opacity:1; transform:translate(-50%,-10px); }

  @media (max-width: 620px){
    #tips{ display:none; }
    #hud{ min-width:150px; padding:9px 11px; }
    .speedo #speed{ font-size:30px; }
    button.btn{ font-size:11.5px; padding:7px 9px; }
    kbd{ display:none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div class="pelican-emoji">🦤</div>
  <h1>鹈鹕骑自行车</h1>
  <div class="bar"><i id="bar"></i></div>
  <small id="loadtxt">正在装配自行车…</small>
</div>

<div id="hud" class="panel">
  <div class="speedo"><div id="speed">0</div><span>km/h</span></div>
  <div class="meter"><i id="pow"></i></div>
  <div class="row"><span class="k">里程</span><b id="dist">0.00 km</b></div>
  <div class="row"><span class="k">踏频</span><b id="cad">0 rpm</b></div>
  <div class="row"><span class="k">视角</span><b id="cam">追车</b></div>
  <div class="row"><span class="k">FPS</span><b id="fps">--</b></div>
</div>

<div id="tips" class="panel">
  <div class="t">操作指南</div>
  <b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放<br />
  <b>空格 / ↑</b> 加速冲刺<br />
  <b>↓ / S</b> 刹车<br />
  <b>B</b> 按铃 · <b>C</b> 切换视角<br />
  <b>1-4</b> 追车/环绕/低机位/鹈鹕视角<br />
  <b>点击鹈鹕</b> 它会叫一声
</div>

<div id="dock" class="panel">
  <button class="btn" id="btnCam">视角：追车<kbd>C</kbd></button>
  <span class="sep"></span>
  <button class="btn" id="btnBoost">冲刺<kbd>Space</kbd></button>
  <button class="btn" id="btnBell">按铃<kbd>B</kbd></button>
  <button class="btn" id="btnSquawk">叫一声</button>
  <span class="sep"></span>
  <button class="btn on" id="btnSfx">音效</button>
  <button class="btn" id="btnMusic">音乐</button>
  <button class="btn on" id="btnBloom">辉光</button>
  <button class="btn on" id="btnShadow">阴影</button>
  <span class="sep"></span>
  <button class="btn" id="btnSpin">自动环绕</button>
  <button class="btn" id="btnShot">截图</button>
</div>

<div id="toast"></div>
<div id="squawk">嘎——！</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
